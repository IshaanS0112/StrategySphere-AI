services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strategy
      POSTGRES_PASSWORD: strategy
      POSTGRES_DB: strategysphere
    ports:
      - "5432:5432"
    volumes:
      - strategy_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The backend creates its schema on startup, so it must not start until
      # Postgres is actually accepting connections - not merely "container up".
      test: ["CMD-SHELL", "pg_isready -U strategy -d strategysphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://strategy:strategy@db:5432/strategysphere
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      # Point at your own sourced benchmark table if you have one; the shipped
      # default is illustrative placeholders.
      INDUSTRY_BENCHMARKS_PATH: ${INDUSTRY_BENCHMARKS_PATH:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  strategy_pgdata:
